name: CI

on:
  push:
    # Branches only: a version tag runs release.yml, which tests and smoke-tests on its own.
    branches: ['**']
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Test and build installer
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.versions.outputs.version }}
      upgrade_version: ${{ steps.versions.outputs.upgrade_version }}
      fail_version: ${{ steps.versions.outputs.fail_version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch jpegtran
        run: ./build/fetch-jpegtran.ps1

      - name: Test
        run: dotnet test -c Release

      - name: Versions
        id: versions
        # The installer of this run is 0.0.<run number>, below every real release (0.1.0 and up), so a machine with a
        # CI test build is always offered the first real release (R45). A second build one patch higher tests the
        # silent upgrade and a third one (built to fail before copying files) tests the recovery from a failed update.
        run: |
          $run = [int]$env:GITHUB_RUN_NUMBER
          # Windows PowerShell's >> would write UTF-16; the runner reads UTF-8.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=0.0.$run`nupgrade_version=0.0.$($run + 1)`nfail_version=0.0.$($run + 2)`n")

      - name: Build installers
        uses: ./.github/actions/build-installers
        with:
          version: ${{ steps.versions.outputs.version }}
          upgrade-version: ${{ steps.versions.outputs.upgrade_version }}
          fail-version: ${{ steps.versions.outputs.fail_version }}

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: IlluxImageTool-Setup-${{ steps.versions.outputs.version }}
          path: |
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.version }}.exe
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.version }}.exe.sha256
          if-no-files-found: error

      - name: Upload test installers
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-installer
          path: |
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.upgrade_version }}.exe
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.fail_version }}.exe
          if-no-files-found: error
          retention-days: 3

  smoke-test:
    name: Install, upgrade and uninstall
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: IlluxImageTool-Setup-${{ needs.build.outputs.version }}
          path: installers

      - uses: actions/download-artifact@v8
        with:
          name: upgrade-test-installer
          path: installers

      - name: Verify and smoke test installer
        uses: ./.github/actions/smoke-test
        with:
          version: ${{ needs.build.outputs.version }}
          upgrade-version: ${{ needs.build.outputs.upgrade_version }}
          fail-version: ${{ needs.build.outputs.fail_version }}
