name: Release

# Runs when a version tag such as v0.2.0 is pushed. Tests, builds and smoke-tests the Windows installer and the macOS
# package, then publishes ONE GitHub Release with exactly four files:
#   IlluxImageTool-Setup-X.Y.Z.exe        + .sha256   (the names the Windows updater expects)
#   IlluxImageTool-X.Y.Z-macOS-arm64.pkg  + .sha256   (the names the macOS updater expects)
# The publish job runs only when both platforms passed, and refuses (no partial release) if a file is missing or
# does not match its checksum or the version.
#
# Manual run (workflow_dispatch): does everything except creating the release (dry run), to prove the four-file check.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      version:
        description: Version to build in a dry run, for example 0.2.0 (no tag is needed or created)
        required: true
        default: '0.2.0'
      dry-run:
        description: Do everything except create the release (a release is only made by pushing a tag)
        type: boolean
        default: true

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  # The tag being released. A manual dry run uses vX.Y.Z of the "version" input instead.
  RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || format('v{0}', inputs.version) }}

jobs:
  build:
    name: Test and build installer
    runs-on: windows-latest
    timeout-minutes: 40
    outputs:
      version: ${{ steps.versions.outputs.version }}
      upgrade_version: ${{ steps.versions.outputs.upgrade_version }}
      fail_version: ${{ steps.versions.outputs.fail_version }}
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - name: Versions from the tag
        id: versions
        # v1.2.3 -> installer 1.2.3. The smoke test also needs a higher version (for the silent upgrade) and a third
        # one (built to fail); they are only used inside this run and are never published.
        run: |
          $tag = $env:RELEASE_TAG
          # No leading zeros (v01.2.3): the release name must equal the version the installer reports and the updater parses.
          if ($tag -notmatch '^v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$') { throw "Tag '$tag' is not of the form vX.Y.Z (numbers without leading zeros)." }
          $major = [int]$Matches[1]; $minor = [int]$Matches[2]; $patch = [int]$Matches[3]
          $version = "$major.$minor.$patch"
          Write-Host "Releasing $version from tag $tag"
          # Windows PowerShell's >> would write UTF-16; the runner reads UTF-8.
          [IO.File]::AppendAllText($env:GITHUB_OUTPUT, "version=$version`nupgrade_version=$major.$minor.$($patch + 1)`nfail_version=$major.$minor.$($patch + 2)`n")

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Fetch jpegtran
        run: ./build/fetch-jpegtran.ps1

      - name: Test
        run: dotnet test -c Release

      - name: Build installers
        uses: ./.github/actions/build-installers
        with:
          version: ${{ steps.versions.outputs.version }}
          upgrade-version: ${{ steps.versions.outputs.upgrade_version }}
          fail-version: ${{ steps.versions.outputs.fail_version }}

      - name: Check the built files match the tag
        env:
          VERSION: ${{ steps.versions.outputs.version }}
        run: |
          $dir = 'artifacts/installer'
          $exe = "IlluxImageTool-Setup-$env:VERSION.exe"
          foreach ($name in @($exe, "$exe.sha256")) {
            if (-not (Test-Path -LiteralPath (Join-Path $dir $name))) { throw "Expected $dir/$name was not built; the tag $env:RELEASE_TAG and the built files do not match." }
          }
          $info = (Get-Item -LiteralPath (Join-Path $dir $exe)).VersionInfo
          Write-Host "$exe : file version $($info.FileVersion), product version $($info.ProductVersion)"

      - name: Upload installer
        uses: actions/upload-artifact@v7
        with:
          name: IlluxImageTool-Setup-${{ steps.versions.outputs.version }}
          path: |
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.version }}.exe
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.version }}.exe.sha256
          if-no-files-found: error

      - name: Upload test installers
        uses: actions/upload-artifact@v7
        with:
          name: upgrade-test-installer
          path: |
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.upgrade_version }}.exe
            artifacts/installer/IlluxImageTool-Setup-${{ steps.versions.outputs.fail_version }}.exe
          if-no-files-found: error
          retention-days: 3

  smoke-test:
    name: Install, upgrade and uninstall
    needs: build
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: IlluxImageTool-Setup-${{ needs.build.outputs.version }}
          path: installers

      - uses: actions/download-artifact@v8
        with:
          name: upgrade-test-installer
          path: installers

      - name: Verify and smoke test installer
        uses: ./.github/actions/smoke-test
        with:
          version: ${{ needs.build.outputs.version }}
          upgrade-version: ${{ needs.build.outputs.upgrade_version }}
          fail-version: ${{ needs.build.outputs.fail_version }}
          # The public v0.1.0 installer (checked against its .sha256 asset) is installed first and upgraded to this build.
          previous-release-version: '0.1.0'

  macos:
    name: Test, build and smoke test the macOS package
    runs-on: macos-15
    timeout-minutes: 60
    outputs:
      version: ${{ steps.versions.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - name: Versions from the tag
        id: versions
        # Same rule as for Windows: v1.2.3 -> package 1.2.3; the smoke test also builds 1.2.4 (never published).
        run: |
          re='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          if [[ ! "$RELEASE_TAG" =~ $re ]]; then
            echo "Tag '$RELEASE_TAG' is not of the form vX.Y.Z (numbers without leading zeros)."; exit 1
          fi
          major="${BASH_REMATCH[1]}"; minor="${BASH_REMATCH[2]}"; patch="${BASH_REMATCH[3]}"
          echo "Releasing $major.$minor.$patch from tag $RELEASE_TAG"
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"
          echo "upgrade_version=$major.$minor.$((patch + 1))" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build jpegtran
        run: ./build/fetch-jpegtran.sh

      - name: Test
        run: dotnet test -c Release

      - name: Build, check and smoke test the packages
        uses: ./.github/actions/macos-package
        with:
          version: ${{ steps.versions.outputs.version }}
          upgrade-version: ${{ steps.versions.outputs.upgrade_version }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: IlluxImageTool-${{ steps.versions.outputs.version }}-macOS-arm64
          path: |
            artifacts/installer/IlluxImageTool-${{ steps.versions.outputs.version }}-macOS-arm64.pkg
            artifacts/installer/IlluxImageTool-${{ steps.versions.outputs.version }}-macOS-arm64.pkg.sha256
          if-no-files-found: error

      - name: Upload smoke-test logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: macos-smoke-test-logs
          path: ${{ runner.temp }}/smoke/logs/
          if-no-files-found: ignore
          retention-days: 7

  publish:
    name: Publish GitHub Release
    # Only when BOTH platforms were built and smoke-tested. A release is never made with one platform.
    needs: [build, smoke-test, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Checkout only for the release notes (docs/release-notes/vX.Y.Z.md); the four files come from the earlier jobs.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: IlluxImageTool-Setup-${{ needs.build.outputs.version }}
          path: release-files

      - uses: actions/download-artifact@v8
        with:
          name: IlluxImageTool-${{ needs.macos.outputs.version }}-macOS-arm64
          path: release-files

      - name: Check the four files
        env:
          VERSION: ${{ needs.build.outputs.version }}
          MAC_VERSION: ${{ needs.macos.outputs.version }}
        run: |
          set -eu
          if [ "$RELEASE_TAG" != "v$VERSION" ] || [ "$MAC_VERSION" != "$VERSION" ]; then
            echo "Tag '$RELEASE_TAG', Windows version '$VERSION' and macOS version '$MAC_VERSION' must all match."; exit 1
          fi
          exe="IlluxImageTool-Setup-$VERSION.exe"
          pkg="IlluxImageTool-$VERSION-macOS-arm64.pkg"
          expected="$(printf '%s\n' "$exe" "$exe.sha256" "$pkg" "$pkg.sha256" | sort)"
          found="$(cd release-files && find . -type f | sed 's|^\./||' | sort)"
          if [ "$found" != "$expected" ]; then
            echo "Release files are:"; echo "$found"; echo "Expected exactly:"; echo "$expected"; exit 1
          fi
          cd release-files
          for name in "$exe" "$pkg"; do
            # The file holds "<64 hex digits>  <name>" (two spaces), written by the build.
            checksum="$(tr -d '\r' < "$name.sha256" | head -n 1)"
            actual="$(sha256sum "$name" | cut -d' ' -f1)  $name"
            if [ "$checksum" != "$actual" ]; then echo "Checksum file of $name says '$checksum', the file is '$actual'"; exit 1; fi
            echo "$checksum"
          done
          echo "All four files are present, named for $VERSION, and match their checksums."

      - name: Create the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        # One full release: neither --draft nor --prerelease (the updaters ignore both). The body is
        # docs/release-notes/vX.Y.Z.md when it exists, else generated notes.
        run: |
          set -eu
          if [ -f "docs/release-notes/v$VERSION.md" ]; then notes=(--notes-file "docs/release-notes/v$VERSION.md"); else notes=(--generate-notes); fi
          gh release create "$RELEASE_TAG" \
            "release-files/IlluxImageTool-Setup-$VERSION.exe" \
            "release-files/IlluxImageTool-Setup-$VERSION.exe.sha256" \
            "release-files/IlluxImageTool-$VERSION-macOS-arm64.pkg" \
            "release-files/IlluxImageTool-$VERSION-macOS-arm64.pkg.sha256" \
            --repo "$GITHUB_REPOSITORY" --verify-tag --title "$RELEASE_TAG" "${notes[@]}"

      - name: Dry run, no release created
        if: github.event_name != 'push'
        env:
          DRY_RUN: ${{ inputs.dry-run }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "Manual run: everything above passed. No release was created (a release is only made by pushing a tag)."
          if [ "$DRY_RUN" != "true" ]; then echo "::warning::dry-run=false is ignored: releases come only from a tag push."; fi
          if [ -f "docs/release-notes/v$VERSION.md" ]; then echo "Release notes found: docs/release-notes/v$VERSION.md"
          else echo "::warning::No docs/release-notes/v$VERSION.md; a real release would use generated notes."; fi
